services:
  app:
    build:
      context: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb:10.6
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: kazna
      MYSQL_USER: kazna
      MYSQL_PASSWORD: kazna
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
